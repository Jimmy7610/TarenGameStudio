<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taren Game Studio</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#edf2f4;background:#071016}
*{box-sizing:border-box}body{margin:0;background:#071016;color:#edf2f4}a{color:inherit;text-decoration:none}button,input{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid #20303a;background:#0a1218;padding:16px;position:sticky;top:0;height:100vh}
.logo small{display:block;color:#62cfbf;font-size:9px;letter-spacing:.15em;font-weight:900}.logo b{display:block;font-size:17px;margin-top:4px}.nav{margin-top:22px;display:grid;gap:5px}.nav a{padding:10px;border-radius:7px;color:#95a6b0;font-size:12px;font-weight:750}.nav a:hover,.nav a.active{background:#132029;color:white}.nav a.hq{border:1px solid #245c52;color:#8de7d2;background:#10211d}.main{min-width:0}.top{height:64px;border-bottom:1px solid #20303a;display:flex;align-items:center;gap:10px;padding:0 20px;background:#091116;position:sticky;top:0;z-index:10}.top h1{font-size:18px;margin-right:auto}.live{padding:6px 9px;border:1px solid #27564d;border-radius:999px;background:#10211e;color:#7fe1c6;font-size:9px;font-weight:900}.project-select{background:#0c171e;border:1px solid #31434e;color:white;border-radius:6px;padding:8px;min-width:240px}
.content{padding:20px;max-width:1500px}.hero{padding:22px;border:1px solid #253640;border-radius:10px;background:linear-gradient(135deg,#0f1b22,#0a1116);display:flex;gap:18px;align-items:center}.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#8fa0aa}.grow{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 13px;border-radius:7px;border:1px solid #31514c;background:#143029;color:#8ef0d4;font-weight:900;font-size:11px;cursor:pointer}.btn.primary{background:#1b9b8b;color:white;border-color:#36b4a4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.card{border:1px solid #263640;border-radius:9px;background:#0c151b;padding:14px;min-width:0}.card h3{margin:0 0 8px;font-size:12px}.metric b{font:900 24px/1 monospace}.metric small{display:block;color:#7f909b;margin-top:5px;font-size:8px}.section{margin-top:18px}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.section-head h3{margin:0;font-size:14px}.muted{color:#7f909b;font-size:10px}.list{border:1px solid #263640;border-radius:9px;overflow:hidden;background:#0c151b}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:11px 13px;border-bottom:1px solid #1c2830;align-items:center}.row:last-child{border-bottom:0}.row b{font-size:11px}.row small{display:block;color:#81909a;margin-top:3px;font-size:9px}.pill{padding:4px 6px;border:1px solid #344650;border-radius:999px;font-size:8px;color:#b8c5cb}.empty{padding:18px;color:#788893;font-size:10px}.cols{display:grid;grid-template-columns:2fr 1fr;gap:12px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.column{border:1px solid #263640;border-radius:8px;background:#0c151b;min-height:220px;padding:9px}.column h4{margin:0 0 8px;font-size:9px;color:#8ea0aa}.task{padding:8px;border:1px solid #2a3943;border-radius:6px;background:#111c23;margin-bottom:7px}.task b{font-size:9px}.task small{display:block;margin-top:3px;color:#80909a;font-size:8px}
.event{font-family:ui-monospace,monospace;font-size:8px}.decision{padding:12px;border-bottom:1px solid #1c2830}.decision:last-child{border-bottom:0}.decision h4{margin:0 0 5px;font-size:11px}.decision p{margin:3px 0;color:#a6b1b7;font-size:9px;line-height:1.45}.coming{padding:28px;border:1px dashed #34454e;border-radius:10px;text-align:center;color:#85949d;background:#0b1419}.coming b{display:block;color:#e7ecee;font-size:15px;margin-bottom:5px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid #20303a}.nav{grid-template-columns:repeat(3,1fr)}.grid,.kanban,.cols{grid-template-columns:1fr 1fr}.top{position:static}.project-select{min-width:140px}}
</style></head>
<body>
<div class="app">
<aside class="side">
 <div class="logo"><small>TAREN PLATFORM</small><b>Game Studio</b></div>
 <nav class="nav">
  <a href="/">Overview</a><a class="hq" href="/hq">🎮 HQ</a><a href="/projects">Projects</a><a href="/tasks">Tasks</a><a href="/meetings">Meetings</a><a href="/decisions">Decisions</a><a href="/builds">Builds</a><a href="/playtests">Playtests</a><a href="/logs">Logs</a><a href="/settings">Settings</a>
 </nav>
</aside>
<main class="main">
 <header class="top"><h1 id="pageTitle">Overview</h1><span class="live">● STUDIO LIVE</span><select id="projectSelect" class="project-select"></select></header>
 <div id="content" class="content"></div>
</main>
</div>
<script>
let projects=[],state=null;
const route=location.pathname;
const titles={"/":"Overview","/projects":"Projects","/tasks":"Tasks","/meetings":"Meetings","/decisions":"Decisions","/builds":"Builds","/playtests":"Playtests","/logs":"Logs","/settings":"Settings"};
document.getElementById("pageTitle").textContent=titles[route]||"Game Studio";
document.querySelectorAll(".nav a").forEach(a=>{if(a.getAttribute("href")===route)a.classList.add("active")});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function selectedId(){return document.getElementById("projectSelect").value||localStorage.getItem("tgs_project_id")||""}
async function boot(){
 projects=await fetch("/api/projects",{cache:"no-store"}).then(r=>r.json());
 const select=document.getElementById("projectSelect");
 select.innerHTML=projects.length?projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.status)+'</option>').join(""):'<option value="">Inga projekt</option>';
 const saved=localStorage.getItem("tgs_project_id");
 if(saved&&projects.some(p=>p.id===saved))select.value=saved;
 else if(projects[0]){select.value=projects[0].id;localStorage.setItem("tgs_project_id",projects[0].id)}
 select.onchange=()=>{localStorage.setItem("tgs_project_id",select.value);loadState()};
 await loadState();
}
async function loadState(){
 const id=selectedId();state=null;
 if(id){const r=await fetch("/api/studio/state?project_id="+encodeURIComponent(id),{cache:"no-store"});if(r.ok)state=await r.json()}
 render();
}
function metric(label,value){return '<div class="card metric"><b>'+value+'</b><small>'+label+'</small></div>'}
function currentProject(){return state?state.project:null}
function overview(){
 if(!state)return '<div class="coming"><b>Inget projekt ännu</b>Skapa ett projekt via API eller Projects-vyn.</div>';
 const p=currentProject(),open=state.tasks.filter(t=>!["DONE","FAILED","CANCELLED"].includes(t.status)).length,active=state.agents.filter(a=>["WORKING","REVIEWING","TESTING","MEETING"].includes(a.state)).length,done=state.tasks.filter(t=>t.status==="DONE").length;
 return '<div class="hero"><div><h2>'+esc(p.name)+'</h2><p>Status '+esc(p.status)+(p.current_milestone?' · '+esc(p.current_milestone):'')+'</p></div><span class="grow"></span><a class="btn primary" href="/hq">Open Game Studio HQ</a></div>'+
 '<div class="grid">'+metric("Aktiva agenter",active)+metric("Öppna tasks",open)+metric("Klara tasks",done)+metric("Events",state.events.length)+'</div>'+
 '<div class="cols section"><div><div class="section-head"><h3>Team</h3></div><div class="list">'+state.agents.map(a=>'<div class="row"><span><b>'+esc(a.display_name)+'</b><small>'+esc(a.display_role)+'</small></span><span class="pill">'+esc(a.state)+'</span></div>').join("")+'</div></div>'+
 '<div><div class="section-head"><h3>Senaste möten</h3></div><div class="list">'+(state.meetings.slice(0,5).map(m=>'<div class="row"><span><b>'+esc(m.type)+'</b><small>'+esc(m.topic)+'</small></span><span class="pill">'+esc(m.status)+'</span></div>').join("")||'<div class="empty">Inga möten.</div>')+'</div></div></div>';
}
function projectPage(){
 return '<div class="section-head"><h3>Projects</h3><span class="muted">'+projects.length+' projekt</span></div><div class="list">'+(projects.map(p=>'<div class="row"><span><b>'+esc(p.name)+'</b><small>'+esc(p.id)+'</small></span><span><span class="pill">'+esc(p.status)+'</span> <button class="btn" onclick="chooseProject(\''+p.id+'\')">Öppna</button></span></div>').join("")||'<div class="empty">Inga projekt.</div>')+'</div>';
}
function tasksPage(){
 if(!state)return '<div class="empty">Välj ett projekt.</div>';
 const groups=["TODO","READY","WORKING","REVIEW","DONE"];
 return '<div class="kanban">'+groups.slice(0,4).map(s=>'<div class="column"><h4>'+s+'</h4>'+state.tasks.filter(t=>t.status===s).map(t=>'<div class="task"><b>'+esc(t.title)+'</b><small>'+esc(t.owner_agent_id||"unassigned")+' · '+esc(t.priority)+'</small></div>').join("")+'</div>').join("")+'</div><div class="section"><div class="section-head"><h3>Done</h3></div><div class="list">'+(state.tasks.filter(t=>t.status==="DONE").map(t=>'<div class="row"><span><b>'+esc(t.title)+'</b><small>'+esc(t.owner_agent_id||"")+'</small></span><span class="pill">DONE</span></div>').join("")||'<div class="empty">Inga klara tasks.</div>')+'</div></div>';
}
function meetingsPage(){
 if(!state)return '<div class="empty">Välj ett projekt.</div>';
 return '<div class="list">'+(state.meetings.map(m=>'<div class="decision"><h4>'+esc(m.type)+' · '+esc(m.status)+'</h4><p>'+esc(m.topic)+'</p><p>Participants: '+esc((m.participants||[]).join(", "))+(m.devil_advocate_agent_id?' · Devil’s Advocate: '+esc(m.devil_advocate_agent_id):'')+'</p><p>'+esc(m.outcome_summary||"")+'</p></div>').join("")||'<div class="empty">Inga möten.</div>')+'</div>';
}
function decisionsPage(){
 if(!state)return '<div class="empty">Välj ett projekt.</div>';
 return '<div class="list">'+((state.decisions||[]).map(d=>'<div class="decision"><h4>'+esc(d.key)+'</h4><p><b>'+esc(d.decision)+'</b></p><p>'+esc(d.reason)+'</p></div>').join("")||'<div class="empty">Inga beslut.</div>')+'</div>';
}
function logsPage(){
 if(!state)return '<div class="empty">Välj ett projekt.</div>';
 return '<div class="list">'+state.events.slice().reverse().map(e=>'<div class="row event"><span><b>'+esc(e.type)+'</b><small>'+esc(e.actor)+' · '+esc(new Date(e.timestamp).toLocaleString("sv-SE"))+'</small></span></div>').join("")+'</div>';
}
function buildsPage(){
 const arts=state?(state.artifacts||[]):[];const builds=arts.filter(a=>String(a.type).toLowerCase().includes("build"));
 return builds.length?'<div class="list">'+builds.map(a=>'<div class="row"><span><b>'+esc(a.type)+'</b><small>'+esc(a.ref)+'</small></span></div>').join("")+'</div>':'<div class="coming"><b>Build pipeline ej inkopplad ännu</b>När riktiga runners producerar builds visas de här.</div>';
}
function playtestsPage(){return '<div class="coming"><b>AI Playtests kommer här</b>Telemetry, screenshots/video, AI-review och förbättringsloop kopplas in efter riktiga runners.</div>'}
function settingsPage(){return '<div class="card"><h3>Studio Settings</h3><p class="muted">Nuvarande projekt sparas lokalt i webbläsaren. Runners, GitHub-integration, build targets och human approval gates läggs här när de kopplas in.</p><a class="btn" href="/docs">Open API docs</a></div>'}
function chooseProject(id){localStorage.setItem("tgs_project_id",id);document.getElementById("projectSelect").value=id;loadState()}
function render(){
 let html="";
 if(route==="/")html=overview();else if(route==="/projects")html=projectPage();else if(route==="/tasks")html=tasksPage();else if(route==="/meetings")html=meetingsPage();else if(route==="/decisions")html=decisionsPage();else if(route==="/builds")html=buildsPage();else if(route==="/playtests")html=playtestsPage();else if(route==="/logs")html=logsPage();else html=settingsPage();
 document.getElementById("content").innerHTML=html;
}
boot();
</script>
</body></html>

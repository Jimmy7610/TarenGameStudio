function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function meta(a){return META[a.id]||{name:a.display_name||a.id,role:a.display_role||a.role,asset:"/studio-assets/agents/"+a.id+".svg?v=2",initials:a.id.slice(0,2).toUpperCase()}}
function pos(a){
 const base=(POS[a.id]&&POS[a.id][a.state])||[50,50];
 if(a.state!=="IDLE"&&a.state!=="WAITING")return base;
 const variants=IDLE_VARIANTS[a.id]||[base];
 const slot=Math.floor(Date.now()/15000)%variants.length;
 return variants[slot];
}
function ensureActors(){
 const stage=document.getElementById("stage");
 ["chatgpt","claude","codex","antigravity"].forEach(id=>{
  if(document.getElementById("actor-"+id))return;
  const m=META[id],el=document.createElement("div");el.className="agent";el.id="actor-"+id;
  el.innerHTML='<div class="bubble"></div><img class="sprite" src="'+m.asset+'"><div class="fallback-avatar">'+m.initials+'</div><div class="tag">'+esc(m.name)+'</div>';
  const img=el.querySelector(".sprite"),fallback=el.querySelector(".fallback-avatar");
  img.onerror=()=>{img.style.display="none";fallback.style.display="flex"};
  el.onclick=()=>inspect(id);stage.appendChild(el);
 });
}
function move(a,animate=true){
 const el=document.getElementById("actor-"+a.id);if(!el)return;const p=pos(a);
 if(animate)el.classList.add("moving");el.style.left=p[0]+"%";el.style.top=p[1]+"%";el.style.setProperty("--status",STATUS_COLOR[a.state]||"#89959e");
 el.querySelector(".tag").style.display=names?"block":"none";
 const task=state&&state.tasks?state.tasks.find(t=>t.id===a.current_task_id):null;
 const b=el.querySelector(".bubble");
 b.textContent=task&&["WORKING","REVIEWING","TESTING"].includes(a.state)?task.title:(BUBBLE[a.state]||a.state);
 b.classList.add("show");
 setTimeout(()=>b.classList.remove("show"),2400);
 setTimeout(()=>el.classList.remove("moving"),1050);
}
function render(){
 if(!state)return;ensureActors();
 document.getElementById("projectName").textContent=state.project.name+" · "+state.project.status;
 document.getElementById("working").textContent=state.agents.filter(a=>["WORKING","REVIEWING","TESTING","MEETING"].includes(a.state)).length;
 document.getElementById("openTasks").textContent=state.tasks.filter(t=>!["DONE","FAILED","CANCELLED"].includes(t.status)).length;
 document.getElementById("meetingCount").textContent=state.meetings.length;
 state.agents.forEach(a=>move(a));
 const activeMeeting=state.meetings.find(m=>m.status==="ACTIVE"||m.status==="OPEN");
 if(activeMeeting&&Array.isArray(activeMeeting.participants)){
  activeMeeting.participants.forEach(id=>{
   const a=state.agents.find(x=>x.id===id);
   if(a&&a.state==="MEETING")move(a,true);
  });
 }
 document.getElementById("agentList").innerHTML=state.agents.map(a=>{const m=meta(a);return '<div class="agent-card" onclick="inspect(\''+a.id+'\')"><span class="avatar-mini" style="background-image:url('+m.asset+')"></span><span><b>'+esc(m.name)+'</b><small>'+esc(m.role)+(a.current_task_id?' · task '+esc(a.current_task_id.slice(0,8)):'')+'</small></span><span class="status-pill">'+esc(a.state)+'</span></div>'}).join("");
 document.getElementById("eventLog").innerHTML=state.events.slice().reverse().map(e=>'<div class="event"><b>'+esc(e.type)+'</b> · '+esc(e.actor)+'<small>'+esc(new Date(e.timestamp).toLocaleTimeString("sv-SE"))+'</small></div>').join("");
 document.getElementById("eventCount").textContent=state.events.length;
}
async function connectStudio(){
 const id=document.getElementById("projectId").value.trim();if(!id)return;
 localStorage.setItem("tgs_project_id",id);
 if(ws)ws.close();await load(id);
 const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(proto+"://"+location.host+"/ws/events?project_id="+encodeURIComponent(id));
 ws.onopen=()=>document.getElementById("liveText").textContent="STUDIO LIVE";
 ws.onmessage=e=>{const evt=JSON.parse(e.data);if(eventIds.has(evt.id))return;eventIds.add(evt.id);clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>load(id,false),120)};
 ws.onclose=()=>document.getElementById("liveText").textContent="STUDIO OFFLINE";
}
async function load(id,reset=true){
 const r=await fetch("/api/studio/state?project_id="+encodeURIComponent(id),{cache:"no-store"});if(!r.ok){document.getElementById("liveText").textContent="PROJECT NOT FOUND";return}
 state=await r.json();if(reset){eventIds=new Set(state.events.map(e=>e.id))}render();
}
function refreshState(){const id=document.getElementById("projectId").value.trim();if(id)load(id,false)}
function inspect(id){
 if(!state)return;
 const a=state.agents.find(x=>x.id===id);if(!a)return;
 const m=meta(a),task=state.tasks.find(t=>t.id===a.current_task_id);
 const owned=state.tasks.filter(t=>t.owner_agent_id===id);
 const done=owned.filter(t=>t.status==="DONE").length;
 const active=owned.filter(t=>["READY","WORKING","REVIEW"].includes(t.status)).length;
 const latest=(state.events||[]).filter(e=>{
   const p=e.payload||{};
   return e.actor===id||p.agent_id===id||p.owner_agent_id===id||p.reviewer_agent_id===id;
 }).slice(-6).reverse();
 const eventHtml=latest.length?latest.map(e=>'<div class="event-mini"><b>'+esc(e.type)+'</b><small>'+esc(new Date(e.timestamp).toLocaleTimeString("sv-SE"))+' · '+esc(e.actor)+'</small></div>').join(""):'<div class="event-mini">Inga direkta agent-events ännu.</div>';
 const p=document.getElementById("inspector");p.classList.remove("hidden");
 p.innerHTML='<div class="inspector-head"><img src="'+m.asset+'" alt=""><div><h3>'+esc(m.name)+'</h3><p>'+esc(m.role)+'</p><p>Status: <b>'+esc(a.state)+'</b></p></div></div>'+
 '<div class="taskbox">'+(task?'<b>'+esc(task.title)+'</b><br>'+esc(task.status)+' · '+esc(task.priority):'Ingen aktiv task')+'</div>'+
 '<div class="inspector-stats"><div><b>'+owned.length+'</b>tasks</div><div><b>'+done+'</b>klara</div><div><b>'+active+'</b>aktiva</div></div>'+
 '<div class="inspector-section"><h4>Senaste agent-events</h4>'+eventHtml+'</div>'+
 '<button onclick="document.getElementById(\'inspector\').classList.add(\'hidden\')" style="margin-top:10px">Stäng</button>';
}
function zoom(delta){scale=Math.max(.88,Math.min(1.25,scale+delta));document.getElementById("stage").style.transform="scale("+scale+")"}
function toggleNames(){names=!names;if(state)state.agents.forEach(a=>move(a,false))}
function fullscreenHQ(){const el=document.querySelector(".left");if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen&&el.requestFullscreen()}
document.getElementById("officeBg").onerror=function(){this.style.display="none";document.getElementById("fallbackOffice").style.display="grid"};
document.getElementById("officeBg").onload=function(){document.getElementById("fallbackOffice").style.display="none"};
ensureActors();
const savedProject=localStorage.getItem("tgs_project_id");
if(savedProject){
 document.getElementById("projectId").value=savedProject;
 connectStudio();
}
setInterval(()=>{
 if(state){
  state.agents.filter(a=>a.state==="IDLE"||a.state==="WAITING").forEach(a=>move(a,true));
 }
},15000);
</script>
